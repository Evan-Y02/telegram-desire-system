<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>伴侣 · 内在状态</title><style>
:root{color-scheme:dark;--bg:#0c1016;--card:#161d27;--line:#263244;--text:#edf2f7;--muted:#94a3b8;--accent:#d27886}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui;padding:18px}
main{max-width:960px;margin:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:end}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}.card,.event{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.value{font-size:26px;font-weight:700}.bar{height:6px;background:#273244;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.event{margin:10px 0}.event summary{cursor:pointer;font-weight:650}.tag{font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.folder{margin:18px 0;border:1px solid var(--line);border-radius:16px;background:#111822;overflow:hidden}.folder>summary{display:flex;align-items:center;gap:10px;cursor:pointer;padding:17px 18px;font-size:22px;font-weight:750;list-style:none}.folder>summary::-webkit-details-marker{display:none}.folder>summary::before{content:'▶';font-size:14px;color:var(--muted);transition:transform .15s}.folder[open]>summary::before{transform:rotate(90deg)}.folder-count{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px}.folder-body{padding:0 14px 14px}.more{display:block;width:100%;margin-top:10px}.more[hidden]{display:none}
pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}button,a.btn{background:#202b3a;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-decoration:none}button:disabled{opacity:.7}
</style></head><body><main>
<header><div><h1>伴侣 · 内在状态</h1><div id="meta" class="muted">载入中…</div></div><button id="refresh" type="button">刷新</button></header>
<section id="drives" class="grid"></section>
<details class="folder"><summary><span>自主行动时间线</span><span id="timeline-count" class="folder-count">0 条</span></summary><div class="folder-body"><section id="timeline"></section><button id="timeline-more" class="more" type="button" hidden>显示更多</button></div></details>
<details class="folder"><summary><span>经历与札记</span><span id="experiences-count" class="folder-count">0 条</span></summary><div class="folder-body"><section id="experiences"></section><button id="experiences-more" class="more" type="button" hidden>显示更多</button></div></details>
<p><a class="btn" href="./logout">退出面板</a></p>
</main><script>
const names={attachment:'依恋',longing:'想念',curiosity:'好奇',reflection:'反思',duty:'责任',social:'社交',fatigue:'疲劳',libido:'性欲',stress:'压力',arousal:'唤起',reserve:'储备'};
const labels={autonomous_wake:'自主唤醒',autonomy_eligible:'达到行动门槛',contact_wife:'主动找你',solo:'私密札记',reflect:'反思札记',explore:'探索札记',duty:'责任行动',social:'社交行动',rest:'休息'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=v=>new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
let snapshot=null,timelineShown=10,experiencesShown=10,refreshing=false;

function timelineEvents(){
  return snapshot?[...(snapshot.state.timeline||[])].filter(e=>e.type!=='conversation_stimulus').reverse():[];
}
function journalEvents(){
  return snapshot?[...(snapshot.experiences||[])].filter(e=>e.type==='autonomous_action').reverse():[];
}
function renderTimeline(){
  const events=timelineEvents(),visible=events.slice(0,timelineShown),more=document.querySelector('#timeline-more');
  document.querySelector('#timeline-count').textContent=events.length+' 条';
  document.querySelector('#timeline').innerHTML=visible.length?visible.map(e=>'<details class="event"><summary>'+esc(time(e.at))+' · '+esc(labels[e.type]||e.type)+' <span class="tag">'+esc(e.status)+'</span></summary><p>'+esc(e.summary||'')+'</p><pre>'+esc(JSON.stringify({reasons:e.reasons,actions:e.actions},null,2))+'</pre></details>').join(''):'<p class="muted">还没有自主行动记录。</p>';
  more.hidden=timelineShown>=events.length;
  more.textContent='显示更多（还有 '+Math.max(0,events.length-timelineShown)+' 条）';
}
function renderExperiences(){
  const entries=journalEvents(),visible=entries.slice(0,experiencesShown),more=document.querySelector('#experiences-more');
  document.querySelector('#experiences-count').textContent=entries.length+' 条';
  document.querySelector('#experiences').innerHTML=visible.length?visible.map(e=>'<details class="event"><summary>'+esc(time(e.at))+' · '+esc(labels[e.kind]||e.kind||'经历')+'</summary><p>'+esc(e.summary||'')+'</p>'+(e.content?'<pre>'+esc(e.content)+'</pre>':'')+'</details>').join(''):'<p class="muted">还没有自主经历或札记。</p>';
  more.hidden=experiencesShown>=entries.length;
  more.textContent='显示更多（还有 '+Math.max(0,entries.length-experiencesShown)+' 条）';
}
async function refreshPanel(){
  if(refreshing)return;
  const btn=document.querySelector('#refresh');refreshing=true;btn.disabled=true;btn.textContent='刷新中…';
  try{
    const r=await fetch('./api/snapshot',{cache:'no-store'});
    if(r.status===401){location.reload();return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    snapshot=await r.json();
    const s=snapshot.state;
    document.querySelector('#meta').textContent=(snapshot.config.observeOnly?'观察模式':'已启用')+' · 北京时间 · 每 '+(snapshot.config.heartbeatSeconds/60)+' 分钟心跳 · 状态 '+time(s.updatedAt)+' · 刷新 '+new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'});
    document.querySelector('#drives').innerHTML=Object.entries(s.drives).map(([k,v])=>'<article class="card"><div class="muted">'+(names[k]||esc(k))+'</div><div class="value">'+Number(v).toFixed(1)+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i></div></article>').join('');
    renderTimeline();renderExperiences();btn.textContent='已刷新';
  }catch(error){
    btn.textContent='刷新失败';document.querySelector('#meta').textContent='刷新失败：'+error.message;
  }finally{
    refreshing=false;btn.disabled=false;setTimeout(()=>{if(!refreshing)btn.textContent='刷新'},1200);
  }
}
document.querySelector('#refresh').addEventListener('click',refreshPanel);
document.querySelector('#timeline-more').addEventListener('click',()=>{timelineShown+=10;renderTimeline()});
document.querySelector('#experiences-more').addEventListener('click',()=>{experiencesShown+=10;renderExperiences()});
refreshPanel();setInterval(refreshPanel,60000);
</script></body></html>
